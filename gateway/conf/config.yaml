server:
  addr: ":8080"

# 限流专用 Redis（开发阶段与业务共用，生产环境隔离）
redis:
  addr: "10.211.55.5:6379"
  password: ""  # 通过 REDIS_PASSWORD 环境变量或 .env 设置
  db: 0

jwt:
  secret: ""  # 通过 JWT_SECRET 环境变量或 .env 设置

cors:
  allowOrigins:
    - "*"  # 生产环境替换为具体域名

# proto 文件基础路径（相对于网关工作目录），默认 "../"
# proto 约定路径: {protoBase}{serviceName}/api/{serviceName}.proto
protoBase: "../"

etcd:
  addrs:
    - "10.211.55.5:2379"

mode: "dev"

# 分布式限流配置 (Redis 滑动窗口)
rateLimit:
  limit: 100          # 窗口内最大请求数
  windowSec: 60       # 滑动窗口时长（秒）

# 熔断器配置
circuitBreaker:
  maxRequests: 5             # 半开状态最大探测请求数
  intervalSec: 60            # 统计间隔（秒）
  timeoutSec: 10             # 熔断恢复超时（秒）
  consecutiveFailures: 5     # 连续失败触发熔断
