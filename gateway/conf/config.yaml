server:
  addr: ":8080"

redis:
  addr: "10.211.55.5:6379"
  password: ""  # 通过 REDIS_PASSWORD 环境变量设置
  db: 0

jwt:
  secret: ""  # 通过 JWT_SECRET 环境变量设置

cors:
  allowOrigins:
    - "*"  # 生产环境替换为具体域名

# proto 文件基础路径（相对于网关工作目录），默认 "../"
# proto 约定路径: {protoBase}{serviceName}/api/{serviceName}.proto
protoBase: "../"

etcd:
  addrs:
    - "10.211.55.5:2379"

mode: "dev"

# 限流配置
rateLimit:
  rate: 10           # 每秒请求数
  burst: 20          # 突发上限
  maxIPs: 100000     # 最大追踪 IP 数
  cleanupSec: 60     # 清理间隔（秒）
  idleSec: 180       # 空闲过期（秒）

# 熔断器配置
circuitBreaker:
  maxRequests: 5             # 半开状态最大探测请求数
  intervalSec: 60            # 统计间隔（秒）
  timeoutSec: 10             # 熔断恢复超时（秒）
  consecutiveFailures: 5     # 连续失败触发熔断
