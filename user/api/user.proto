syntax = "proto3";

package api.user.v1;

option go_package = "shopmicro/user/kitex_gen/api/user/v1";

enum Gender {
  GENDER_UNKNOWN = 0;
  GENDER_MALE = 1;
  GENDER_FEMALE = 2;
  GENDER_OTHER = 3;
}

service UserService {
  rpc RegisterUser(RegisterUserReq) returns(RegisterUserResp);
  rpc Login(LoginReq) returns(LoginResp);
  rpc RefreshToken(RefreshTokenReq) returns(RefreshTokenResp);
  rpc Logout(LogoutReq) returns(LogoutResp);
  rpc UpdateUser(UpdateUserReq) returns(UpdateUserResp);
  rpc DeleteUser(DeleteUserReq) returns(DeleteUserResp);
  rpc ListUser(ListUserReq) returns(ListUserResp);
}

message RegisterUserReq {
  string password = 1;
  string realName = 2;
  string phone = 3;
  string email = 4;
  Gender gender = 5;
  int32 age = 6;
}

message RegisterUserResp {}

message LoginReq {
  string password = 1;
  string phone = 2;
}

message LoginResp {
  int64 id = 1;
  string realName = 2;
  string avatar = 3;
  Gender gender = 4;
  int32 age = 5;
  string phone = 6;
  string email = 7;
  string remark = 8;
  string token = 9;
  string refreshToken = 10;
}

message RefreshTokenReq {
  string refreshToken = 1;
}

message RefreshTokenResp {
  string token = 1;
  string refreshToken = 2;
}

message LogoutReq {}

message LogoutResp {}

message UpdateUserReq {
  int64 id = 1;
  optional string realName = 2;
  optional string avatar = 3;
  optional Gender gender = 4;
  optional int32 age = 5;
  optional string phone = 6;
  optional string email = 7;
  optional string remark = 8;
}

message UpdateUserResp {}

message DeleteUserReq {
  int64 id = 1;
}

message DeleteUserResp {}

message ListUserReq {
  int32 page = 1;
  int32 pageSize = 2;
  string name = 3;
  string phone = 4;
}

message ListUserResp {
  repeated UserInfo list = 1;
  int32 page = 2;
  int32 pageSize = 3;
  int64 total = 4;
}

// UserInfo 公开用户信息，不含密码
message UserInfo {
  int64 id = 1;
  string realName = 2;
  string avatar = 3;
  Gender gender = 4;
  int32 age = 5;
  string phone = 6;
  string email = 7;
  string remark = 8;
}
