syntax = "proto3";

package api.user.v1;

option go_package = "shopmicro/user/kitex_gen/api/user/v1";

enum Gender {
  GENDER_UNKNOWN = 0;
  GENDER_MALE = 1;
  GENDER_FEMALE = 2;
  GENDER_OTHER = 3;
}

service UserService {
  rpc RegisterUser(RegisterUserReq) returns(RegisterUserResp);
  rpc Login(LoginReq) returns(LoginResp);
  rpc LoginOut(LoginOutReq) returns(LoginOutResp);
  rpc UpdateUser(UpdateUserReq) returns(UpdateUserResp);
  rpc DeleteUser(DeleteUserReq) returns(DeleteUserResp);
  rpc ListUser(ListUserReq) returns(ListUserResp);
}

message UserInfo {
  int64 id = 1;
  string password = 2;
  string realName = 3;
  string avatar = 4;
  Gender gender = 5;
  int32 age = 6;
  string phone = 7;
  string email = 8;
  string remark = 11;
}

message RegisterUserReq {
  string password = 1;
  string realName = 2;
  string phone = 3;
  string email = 4;
  Gender gender = 5;
  int32 age = 6;
}

message RegisterUserResp {
  uint32 code = 1;
  string message = 2;
}

message LoginReq {
  string password = 1;
  string phone = 2;
}

message LoginResp {
  uint32 code = 1;
  string message = 2;
  string token = 3;
  UserInfo data = 4;
}

message LoginOutReq{
  string token = 1;
}

message LoginOutResp{
  uint32 code = 1;
  string message = 2;
}

message UpdateUserReq {
  int64 id = 1;
  string realName = 2;
  string avatar = 3;
  Gender gender = 4;
  int32 age = 5;
  string phone = 6;
  string email = 7;
  string remark = 8;
}

message UpdateUserResp {
  uint32 code = 1;
  string message = 2;
}

message DeleteUserReq {
  int64 id = 1;
}

message DeleteUserResp {
  uint32 code = 1;
  string message = 2;
}

message ListUserReq {
  int32 page = 1;
  int32 pageSize = 2;
  string name = 3;
  string phone = 4;
}

message ListUserResp {
  uint32 code = 1;
  string message = 2;
  repeated UserInfo data = 3;
  int32 page = 4;
  int32 pageSize = 5;
  int64 total = 6;
}
