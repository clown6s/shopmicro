server:
  addr: ":6001"

mysql:
  dsn: ""  # 通过 MYSQL_DSN 环境变量或 .env 设置

# 业务缓存 Redis（开发阶段与网关共用，生产环境隔离）
redis:
  addr: "127.0.0.1:6379"
  password: ""  # 通过 REDIS_PASSWORD 环境变量或 .env 设置
  db: 0

jwt:
  secret: ""  # 通过 JWT_SECRET 环境变量或 .env 设置
  refreshSecret: ""  # 可选: refresh token 独立密钥（不设置则使用 secret）
  expiration: 24
  issuer: "shopmicro"

etcd:
  addrs:
    - "127.0.0.1:2379"

mode: "dev"

# HashiCorp Vault（留空则使用环境变量 .env）
vault:
  address: ""       # 通过 VAULT_ADDRESS 环境变量设置，如 "http://10.211.55.5:8200"
  token: ""         # 通过 VAULT_TOKEN 环境变量设置
  mountPath: "secret"
