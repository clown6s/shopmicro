# Jaeger 2 配置 — shopmicro 微服务架构
# 文档: https://www.jaegertracing.io/docs/v2/configure/

service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]

extensions:
  healthcheckv2:
    http:
      endpoint: 0.0.0.0:16687

  jaeger_storage:
    backends:
      badger_store:
        badger:
          directory_spm: /tmp/jaeger/badger/spm
          directory_trace: /tmp/jaeger/badger/traces
          mmap: false
          log_level: info
          gc_interval: 5m

  jaeger_query:
    storage:
      traces: badger_store
    ui:
      config_file: ""
    http:
      endpoint: 0.0.0.0:16686

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    send_batch_size: 1024
    timeout: 5s

exporters:
  jaeger_storage_exporter:
    trace_storage: badger_store
