# Jaeger 2 配置 — 适配 shopmicro 微服务架构
# 文档: https://www.jaegertracing.io/docs/v2/configure/

service:
  extensions: [healthcheckv2, storage]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]

extensions:
  healthcheckv2:
    endpoint: 0.0.0.0:16687

  storage:
    type: badger          # 内嵌存储，零依赖，适合开发/测试
    directory: /tmp/jaeger
    trace_ttl: 168h      # trace 保留 7 天

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    send_batch_size: 1024
    timeout: 5s

exporters:
  jaeger_storage_exporter:
    storage:
      type: badger

connectors:

components:
  pprof:
    endpoint: 0.0.0.0:1888
