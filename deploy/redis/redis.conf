# ShopMicro Redis 生产配置
# 文件: deploy/redis/redis.conf

# 网络
bind 0.0.0.0
port 6379
protected-mode yes
timeout 300
tcp-keepalive 60

# 密码（通过 docker-compose 环境变量传入）
# requirepass 在 command 中动态设置

# 持久化 — AOF + RDB 双保险
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

save 900 1
save 300 10
save 60 10000

rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# 内存（容器限制 512M，预留 fork 空间，最多用 60%）
maxmemory 300mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# 慢日志
slowlog-log-slower-than 10000
slowlog-max-len 128

# 安全
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""

# 日志
loglevel notice
