# ============================================================
# ShopMicro 基础设施 — 生产级 Docker Compose
# ============================================================
# 服务: MySQL 8.4 / Redis 8.6.2 / etcd 3.6.9
# 使用: docker compose up -d
#
# 注意:
# 1. MySQL root 密码、Redis 密码等敏感值在 .env 中配置
# 2. 生产环境应启用 TLS（见各服务配置文件中的注释）
# ============================================================

name: shopmicro

services:

  # =========================
  # MySQL 8.4
  # =========================
  mysql:
    image: mysql:8.4
    container_name: shopmicro-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-admin@zzp}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-shop_micro}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_0900_ai_ci
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/shopmicro.cnf:ro
      - ./scripts/mysql-init:/docker-entrypoint-initdb.d:ro
    command: >
      --mysql-native-password=ON
      --skip-name-resolve
    networks:
      infra:
        ipv4_address: 172.30.0.10
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-admin@zzp}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # =========================
  # Redis 8.6.2
  # =========================
  redis:
    image: redis:8.6.2
    container_name: shopmicro-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass ${REDIS_PASSWORD:-admin@zzp}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-admin@zzp}
    networks:
      infra:
        ipv4_address: 172.30.0.20
    healthcheck:
      test: ["CMD", "sh", "-c", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # =========================
  # etcd 3.6.9
  # =========================
  etcd:
    image: quay.io/coreos/etcd:v3.6.9
    container_name: shopmicro-etcd
    restart: unless-stopped
    ports:
      - "2379:2379"
      - "2380:2380"
    environment:
      ETCD_NAME: shopmicro-etcd
      ETCD_DATA_DIR: /etcd-data
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://${ETCD_HOST:-10.211.55.6}:2379
      ETCD_LISTEN_PEER_URLS: http://172.30.0.30:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://172.30.0.30:2380
      ETCD_INITIAL_CLUSTER: shopmicro-etcd=http://172.30.0.30:2380
      ETCD_INITIAL_CLUSTER_TOKEN: shopmicro-etcd-token
      ETCD_INITIAL_CLUSTER_STATE: new
      # 快照配置
      ETCD_SNAPSHOT_COUNT: 50000
      ETCD_HEARTBEAT_INTERVAL: 500
      ETCD_ELECTION_TIMEOUT: 2500
      # 配额
      ETCD_QUOTA_BACKEND_BYTES: 8589934592
      # 自动压缩
      ETCD_AUTO_COMPACTION_MODE: periodic
      ETCD_AUTO_COMPACTION_RETENTION: 1h
      # 安全（生产环境应启用 TLS）
      # ETCD_CERT_FILE: /etcd-certs/server.pem
      # ETCD_KEY_FILE: /etcd-certs/server-key.pem
      # ETCD_TRUSTED_CA_FILE: /etcd-certs/ca.pem
      # ETCD_CLIENT_CERT_AUTH: "true"
    volumes:
      - etcd-data:/etcd-data
    networks:
      infra:
        ipv4_address: 172.30.0.30
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health", "--endpoints=http://localhost:2379"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "30m"
        max-file: "3"

# ============================================================
# 网络
# ============================================================
networks:
  infra:
    name: shopmicro-infra
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

# ============================================================
# 持久化卷
# ============================================================
volumes:
  mysql-data:
    name: shopmicro-mysql-data
  redis-data:
    name: shopmicro-redis-data
  etcd-data:
    name: shopmicro-etcd-data
