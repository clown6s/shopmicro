# ShopMicro 微服务编排
# 使用方式: docker compose up -d
# 基础设施需先启动: cd deploy && docker compose up -d
#
# 配置: 每个服务读取自己的 .env 文件（env_file），
#       environment 仅覆盖容器内网络地址（宿主机IP → 容器名）

name: shopmicro

services:
  user:
    build:
      context: .
      dockerfile: user/Dockerfile
    container_name: shopmicro-user
    restart: unless-stopped
    env_file:
      - user/.env
    environment:
      # 容器内网络地址覆盖
      REDIS_ADDR: "shopmicro-redis:6379"
      ETCD_ADDRS: "shopmicro-etcd:2379"
      MYSQL_DSN: "root:${MYSQL_ROOT_PASSWORD:-admin@zzp}@tcp(shopmicro-mysql:3306)/${MYSQL_DATABASE:-shop_micro}?charset=utf8mb4&parseTime=true&loc=Local"
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
    ports:
      - "8888:8888"
      - "8899:8899"
    networks:
      - infra

  district:
    build:
      context: .
      dockerfile: district/Dockerfile
    container_name: shopmicro-district
    restart: unless-stopped
    env_file:
      - district/.env
    environment:
      REDIS_ADDR: "shopmicro-redis:6379"
      ETCD_ADDRS: "shopmicro-etcd:2379"
      MYSQL_DSN: "root:${MYSQL_ROOT_PASSWORD:-admin@zzp}@tcp(shopmicro-mysql:3306)/${MYSQL_DATABASE:-shop_micro}?charset=utf8mb4&parseTime=true&loc=Local"
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
    ports:
      - "8900:8888"
      - "8898:8899"
    networks:
      - infra

  product:
    build:
      context: .
      dockerfile: product/Dockerfile
    container_name: shopmicro-product
    restart: unless-stopped
    env_file:
      - product/.env
    environment:
      REDIS_ADDR: "shopmicro-redis:6379"
      ETCD_ADDRS: "shopmicro-etcd:2379"
      MYSQL_DSN: "root:${MYSQL_ROOT_PASSWORD:-admin@zzp}@tcp(shopmicro-mysql:3306)/${MYSQL_DATABASE:-shop_micro}?charset=utf8mb4&parseTime=true&loc=Local"
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
    ports:
      - "8901:8888"
      - "8897:8897"
    networks:
      - infra

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: shopmicro-gateway
    restart: unless-stopped
    depends_on:
      - user
      - district
      - product
    env_file:
      - gateway/.env
    environment:
      REDIS_ADDR: "shopmicro-redis:6379"
      ETCD_ADDRS: "shopmicro-etcd:2379"
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
    ports:
      - "7000:7000"
    networks:
      - infra

networks:
  infra:
    external: true
    name: shopmicro-infra
