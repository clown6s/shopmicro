version: '3.8'

# ShopMicro 开发/集成测试环境
# 使用方式: docker-compose up -d
# 仅用于开发和 CI，不用于生产部署

services:
  # ==================== 基础设施 ====================

  mysql:
    image: mysql:8.0
    container_name: shopmicro-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_only}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-shopmall}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    command: --default-authentication-plugin=caching_sha2_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7-alpine
    container_name: shopmicro-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-dev_redis_123}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dev_redis_123}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  etcd:
    image: bitnami/etcd:3.5
    container_name: shopmicro-etcd
    restart: unless-stopped
    environment:
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_ADVERTISE_CLIENT_URLS: "http://etcd:2379"
      ETCD_LISTEN_CLIENT_URLS: "http://0.0.0.0:2379"
    ports:
      - "${ETCD_PORT:-2379}:2379"
    volumes:
      - etcd_data:/bitnami/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 10

  vault:
    image: hashicorp/vault:1.17
    container_name: shopmicro-vault
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-dev-vault-token}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "${VAULT_PORT:-8200}:8200"
    healthcheck:
      test: ["CMD-SHELL", "vault status -address=http://localhost:8200 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ==================== 微服务 ====================

  user:
    build:
      context: ./user
      dockerfile: Dockerfile
    container_name: shopmicro-user
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_ADDR: ":8888"
      MYSQL_DSN: "root:${MYSQL_ROOT_PASSWORD:-root_dev_only}@tcp(mysql:3306)/${MYSQL_DATABASE:-shopmall}?charset=utf8mb4&parseTime=true&loc=Local"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-dev_redis_123}"
      ETCD_ADDRS: "etcd:2379"
      JWT_SECRET: "${JWT_SECRET}"
      OTEL_EXPORTER_OTLP_ENDPOINT: ""   # 容器内禁用 otel（避免连接不存在的 collector）
    ports:
      - "${USER_GRPC_PORT:-8888}:8888"
      - "${USER_HEALTH_PORT:-8899}:8899"

  district:
    build:
      context: ./district
      dockerfile: Dockerfile
    container_name: shopmicro-district
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      etcd:
        condition: service_healthy
    environment:
      SERVER_ADDR: ":8888"
      MYSQL_DSN: "root:${MYSQL_ROOT_PASSWORD:-root_dev_only}@tcp(mysql:3306)/${MYSQL_DATABASE:-shopmall}?charset=utf8mb4&parseTime=true&loc=Local"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-dev_redis_123}"
      ETCD_ADDRS: "etcd:2379"
      AMAP_KEY: "${AMAP_KEY}"
      AUTH_JWT_SECRET: "${JWT_SECRET}"
      AUTH_INTERNAL_TOKEN: "${INTERNAL_TOKEN:-dev-internal-token}"
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
    ports:
      - "${DISTRICT_GRPC_PORT:-8900}:8888"
      - "${DISTRICT_HEALTH_PORT:-8898}:8899"

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: shopmicro-gateway
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      etcd:
        condition: service_healthy
      user:
        condition: service_started
      district:
        condition: service_started
    environment:
      SERVER_ADDR: ":7000"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-dev_redis_123}"
      ETCD_ADDRS: "etcd:2379"
      JWT_SECRET: "${JWT_SECRET}"
      PROTO_BASE: "/proto"
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
    ports:
      - "${GATEWAY_HTTP_PORT:-7000}:7000"
    volumes:
      - ./proto:/proto:ro

volumes:
  mysql_data:
  redis_data:
  etcd_data:
