# ============================================================
# ShopMicro 全栈编排 — 基础设施 + 微服务
# ============================================================
# 使用: docker compose up -d
#
# 启动顺序: MySQL/Redis/etcd/Jaeger/Loki → Promtail → user/district/product → gateway → Grafana
# 注意:
# 1. 生产环境应修改密码（搜索 admin@zzp 替换为强密码）
# 2. 生产环境应启用 TLS（见各服务配置文件中的注释）
# 3. Grafana: http://<host>:3000 (admin/admin@zzp)
# 4. Jaeger UI: http://<host>:16686
# ============================================================

name: shopmicro

x-timezone: &timezone "Asia/Shanghai"
x-password: &password "admin@zzp"

services:

  # =========================
  # 基础设施
  # =========================

  mysql:
    image: mysql:8.4
    container_name: shopmicro-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: *password
      MYSQL_DATABASE: "shop_micro"
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_0900_ai_ci
      TZ: *timezone
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/mysql/my.cnf:/etc/mysql/conf.d/shopmicro.cnf:ro
      - ./deploy/scripts/mysql-init:/docker-entrypoint-initdb.d:ro
    command: >
      --mysql-native-password=ON
      --skip-name-resolve
    networks:
      infra:
        ipv4_address: 172.30.0.10
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-padmin@zzp"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  redis:
    image: redis:8.6.2
    container_name: shopmicro-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - ./deploy/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass admin@zzp
    environment:
      REDIS_PASSWORD: *password
    networks:
      infra:
        ipv4_address: 172.30.0.20
    healthcheck:
      test: ["CMD", "sh", "-c", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  etcd:
    image: quay.io/coreos/etcd:v3.6.9
    container_name: shopmicro-etcd
    restart: unless-stopped
    ports:
      - "2379:2379"
      - "2380:2380"
    environment:
      ETCD_NAME: shopmicro-etcd
      ETCD_DATA_DIR: /etcd-data
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://shopmicro-etcd:2379
      ETCD_LISTEN_PEER_URLS: http://172.30.0.30:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://172.30.0.30:2380
      ETCD_INITIAL_CLUSTER: shopmicro-etcd=http://172.30.0.30:2380
      ETCD_INITIAL_CLUSTER_TOKEN: shopmicro-etcd-token
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_SNAPSHOT_COUNT: 50000
      ETCD_HEARTBEAT_INTERVAL: 500
      ETCD_ELECTION_TIMEOUT: 2500
      ETCD_QUOTA_BACKEND_BYTES: 8589934592
      ETCD_AUTO_COMPACTION_MODE: periodic
      ETCD_AUTO_COMPACTION_RETENTION: 1h
    volumes:
      - etcd-data:/etcd-data
    networks:
      infra:
        ipv4_address: 172.30.0.30
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health", "--endpoints=http://localhost:2379"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "30m"
        max-file: "3"

  jaeger:
    image: jaegertracing/jaeger:2.3.0
    container_name: shopmicro-jaeger
    restart: unless-stopped
    user: "0:0"
    command: --config=/etc/jaeger/config.yaml
    volumes:
      - ./deploy/jaeger/config.yaml:/etc/jaeger/config.yaml:ro
      - jaeger-data:/tmp/jaeger
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    environment:
      TZ: *timezone
    networks:
      infra:
        ipv4_address: 172.30.0.40
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:13133/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  loki:
    image: grafana/loki:2.9.10
    container_name: shopmicro-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./deploy/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    environment:
      TZ: *timezone
    networks:
      infra:
        ipv4_address: 172.30.0.50
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "30m"
        max-file: "3"

  promtail:
    image: grafana/promtail:2.9.10
    container_name: shopmicro-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yaml
    volumes:
      - ./deploy/promtail/config.yaml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    environment:
      TZ: *timezone
    networks:
      infra:
        ipv4_address: 172.30.0.51
    depends_on:
      loki:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.3"
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  grafana:
    image: grafana/grafana:11.5.2
    container_name: shopmicro-grafana
    restart: unless-stopped
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      TZ: *timezone
      GF_SECURITY_ADMIN_PASSWORD: *password
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "http://localhost:3000"
      GF_DEFAULT_LANGUAGE: "zh-Hans"
    ports:
      - "3000:3000"
    networks:
      infra:
        ipv4_address: 172.30.0.60
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "30m"
        max-file: "3"

  # =========================
  # 微服务
  # =========================

  user:
    build:
      context: .
      dockerfile: user/Dockerfile
    container_name: shopmicro-user
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      etcd:
        condition: service_healthy
    environment:
      TZ: *timezone
      MODE: "prod"
      REDIS_ADDR: "shopmicro-redis:6379"
      REDIS_PASSWORD: *password
      ETCD_ADDRS: "shopmicro-etcd:2379"
      MYSQL_DSN: "root:admin@zzp@tcp(shopmicro-mysql:3306)/shop_micro?charset=utf8mb4&parseTime=true&loc=Local"
      JWT_SECRET: '4*8#5@7!^i(nj_9876555=+s4x3v9g12m`js0lmb8(-=+-_!`~||\]}mb<.?,.>>,mncukdkieijufonicndknveufw3io'
      JWT_REFRESH_SECRET: '4*8#5@7!^i(ng5yd963=+s4x3v9g12m`js0lmb8(-=+-_!`~||\]}mb<.?,.>>,nv853srwoxw2#09'
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://shopmicro-jaeger:4317"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8899/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - infra

  district:
    build:
      context: .
      dockerfile: district/Dockerfile
    container_name: shopmicro-district
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      etcd:
        condition: service_healthy
    environment:
      TZ: *timezone
      MODE: "prod"
      REDIS_ADDR: "shopmicro-redis:6379"
      ETCD_ADDRS: "shopmicro-etcd:2379"
      MYSQL_DSN: "root:admin@zzp@tcp(shopmicro-mysql:3306)/shop_micro?charset=utf8mb4&parseTime=true&loc=Local"
      AMAP_KEY: "2bf43aed63c04f92dad38aaa6da2db50"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://shopmicro-jaeger:4317"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8898/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - infra

  product:
    build:
      context: .
      dockerfile: product/Dockerfile
    container_name: shopmicro-product
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      etcd:
        condition: service_healthy
    environment:
      TZ: *timezone
      MODE: "prod"
      REDIS_ADDR: "shopmicro-redis:6379"
      ETCD_ADDRS: "shopmicro-etcd:2379"
      MYSQL_DSN: "root:admin@zzp@tcp(shopmicro-mysql:3306)/shop_micro?charset=utf8mb4&parseTime=true&loc=Local"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://shopmicro-jaeger:4317"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8897/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - infra

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: shopmicro-gateway
    restart: unless-stopped
    depends_on:
      user:
        condition: service_healthy
      district:
        condition: service_healthy
      product:
        condition: service_healthy
    environment:
      TZ: *timezone
      MODE: "prod"
      REDIS_ADDR: "shopmicro-redis:6379"
      REDIS_PASSWORD: *password
      ETCD_ADDRS: "shopmicro-etcd:2379"
      JWT_SECRET: '4*8#5@7!^i(nj_9876555=+s4x3v9g12m`js0lmb8(-=+-_!`~||\]}mb<.?,.>>,mncukdkieijufonicndknveufw3io'
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://shopmicro-jaeger:4317"
    ports:
      - "7000:7000"
    networks:
      - infra

# ============================================================
# 网络
# ============================================================
networks:
  infra:
    name: shopmicro-infra
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

# ============================================================
# 持久化卷
# ============================================================
volumes:
  mysql-data:
    name: shopmicro-mysql-data
  redis-data:
    name: shopmicro-redis-data
  etcd-data:
    name: shopmicro-etcd-data
  jaeger-data:
    name: shopmicro-jaeger-data
  loki-data:
    name: shopmicro-loki-data
  grafana-data:
    name: shopmicro-grafana-data
