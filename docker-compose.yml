version: '3.8'

# ShopMicro 微服务编排
# 使用方式: docker-compose up -d
# 基础设施（MySQL/Redis/etcd）需提前部署，见 deploy/docker-compose.yml

services:
  user:
    build:
      context: .
      dockerfile: user/Dockerfile
    container_name: shopmicro-user
    restart: unless-stopped
    environment:
      SERVER_ADDR: ":8888"
      MYSQL_DSN: "${MYSQL_DSN}"
      REDIS_ADDR: "${REDIS_ADDR}"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      ETCD_ADDRS: "${ETCD_ADDRS}"
      JWT_SECRET: "${JWT_SECRET}"
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
    ports:
      - "${USER_GRPC_PORT:-8888}:8888"
      - "${USER_HEALTH_PORT:-8899}:8899"

  district:
    build:
      context: .
      dockerfile: district/Dockerfile
    container_name: shopmicro-district
    restart: unless-stopped
    environment:
      SERVER_ADDR: ":8888"
      MYSQL_DSN: "${MYSQL_DSN}"
      REDIS_ADDR: "${REDIS_ADDR}"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      ETCD_ADDRS: "${ETCD_ADDRS}"
      AMAP_KEY: "${AMAP_KEY}"
      AUTH_JWT_SECRET: "${JWT_SECRET}"
      AUTH_INTERNAL_TOKEN: "${INTERNAL_TOKEN:-dev-internal-token}"
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
    ports:
      - "${DISTRICT_GRPC_PORT:-8900}:8888"
      - "${DISTRICT_HEALTH_PORT:-8898}:8899"

  product:
    build:
      context: .
      dockerfile: product/Dockerfile
    container_name: shopmicro-product
    restart: unless-stopped
    environment:
      SERVER_ADDR: ":8888"
      MYSQL_DSN: "${MYSQL_DSN}"
      REDIS_ADDR: "${REDIS_ADDR}"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      ETCD_ADDRS: "${ETCD_ADDRS}"
      AUTH_JWT_SECRET: "${JWT_SECRET}"
      AUTH_INTERNAL_TOKEN: "${INTERNAL_TOKEN:-dev-internal-token}"
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
    ports:
      - "${PRODUCT_GRPC_PORT:-8901}:8888"
      - "${PRODUCT_HEALTH_PORT:-8897}:8897"

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: shopmicro-gateway
    restart: unless-stopped
    depends_on:
      - user
      - district
      - product
    environment:
      SERVER_ADDR: ":7000"
      REDIS_ADDR: "${REDIS_ADDR}"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      ETCD_ADDRS: "${ETCD_ADDRS}"
      JWT_SECRET: "${JWT_SECRET}"
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
    ports:
      - "${GATEWAY_HTTP_PORT:-7000}:7000"
    volumes:
      - ./proto:/proto:ro
