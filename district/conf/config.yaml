server:
  addr: ":6000"

mysql:
  dsn: ""  # 通过 MYSQL_DSN 环境变量或 .env 设置

# 业务缓存 Redis（开发阶段与网关共用，生产环境隔离）
redis:
  addr: "127.0.0.1:6379"
  password: ""  # 通过 REDIS_PASSWORD 环境变量或 .env 设置
  db: 1

etcd:
  addrs:
    - "127.0.0.1:2379"

mode: "dev"

# 高德地图（行政区划数据源）
amap:
  key: ""       # 通过 AMAP_KEY 环境变量设置
  timeout: 120  # HTTP 请求超时（秒）

# HashiCorp Vault（留空则使用环境变量 .env）
vault:
  address: ""       # 通过 VAULT_ADDRESS 环境变量设置，如 "http://10.211.55.5:8200"
  token: ""         # 通过 VAULT_TOKEN 环境变量设置
  mountPath: "secret"
